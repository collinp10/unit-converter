<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unit Converter</title>

<style>
  body {
    font-family: Segoe UI, Arial, sans-serif;
    background: #f1f5f9;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
a
    background: white;
    max-width: 420px;
    width: 100%;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }
  h1 {
    font-size: 20px;
    margin-bottom: 14px;
  }
  select, input, button {
    width: 100%;
    padding: 8px;
    margin-top: 8px;
    font-size: 14px;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 6px;
    align-items: center;
  }
  button {
    cursor: pointer;
  }
  .result {
    font-weight: bold;
    text-align: center;
    margin-top: 12px;
  }
</style>
</head>

<body>

<div class="card">
  <h1>Unit Converter</h1>

  <select id="mode">
    <option value="electric">Electric Energy</option>
    <option value="gas">Natural Gas Energy</option>
    <option value="gallons">Gallons ↔ Acre‑Feet</option>
    <option value="cytons">CY ↔ Tons</option>
  </select>

  <input type="number" id="value" value="1" />

  <div class="row">
    <select id="fromUnit"></select>
    <button onclick="swapUnits()">↔</button>
    <select id="toUnit"></select>
  </div>

  <div id="materialSection" style="display:none;">
    <select id="material">
      <option value="asphalt">Asphalt</option>
      <option value="concrete">Concrete</option>
      <option value="soil">Soil</option>
    </select>

    <input type="number" step="0.01" id="density" />

    <select id="tonType">
      <option value="short">Short tons</option>
      <option value="metric">Metric tons</option>
    </select>
  </div>

  <div class="result" id="result"></div>

  <button onclick="copyResult()">Copy Result</button>
</div>

<script>
const ELECTRIC = { kWh:1, MWh:1000, GWh:1000000 };

const GAS = {
  BTU:1,
  kBTU:1000,
  MMkBTU:1000000,
  therm:100000,
  Mtherm:100000000000,
  cf:1037,
  ccf:103700,
  mcf:1037000,
  MMcf:1037000000
};

const GALLONS_PER_ACRE_FOOT = 325851;

const DENSITIES = {
  asphalt:1.15,
  concrete:1.35,
  soil:1.25
};

const SHORT_TO_METRIC = 0.90718474;

const modeEl = document.getElementById("mode");
const fromEl = document.getElementById("fromUnit");
const toEl = document.getElementById("toUnit");
const valueEl = document.getElementById("value");
const resultEl = document.getElementById("result");
const materialSection = document.getElementById("materialSection");
const materialEl = document.getElementById("material");
const densityEl = document.getElementById("density");
const tonTypeEl = document.getElementById("tonType");

function populateUnits() {
  fromEl.innerHTML = toEl.innerHTML = "";
  let units = [];

  if (modeEl.value === "electric") units = Object.keys(ELECTRIC);
  if (modeEl.value === "gas") units = Object.keys(GAS);
  if (modeEl.value === "gallons") units = ["gallons","acre-feet"];
  if (modeEl.value === "cytons") units = ["CY","tons"];

  units.forEach(u => {
    fromEl.add(new Option(u,u));
    toEl.add(new Option(u,u));
  });

  toEl.selectedIndex = 1;
}

function calculate() {
  let v = Number(valueEl.value);
  let from = fromEl.value;
  let to = toEl.value;
  let r = v;

  if (modeEl.value === "electric") {
    r = v * ELECTRIC[from] / ELECTRIC[to];
  }
  if (modeEl.value === "gas") {
    r = v * GAS[from] / GAS[to];
  }
  if (modeEl.value === "gallons") {
    r = from === "gallons" ? v / GALLONS_PER_ACRE_FOOT : v * GALLONS_PER_ACRE_FOOT;
  }
  if (modeEl.value === "cytons") {
    let d = Number(densityEl.value);
    let factor = tonTypeEl.value === "metric" ? SHORT_TO_METRIC : 1;
    r = from === "CY" ? v * d * factor : v / (d * factor);
  }

  resultEl.textContent = "Result: " + r.toLocaleString(undefined,{maximumFractionDigits:6});
}

function swapUnits() {
  let t = fromEl.value;
  fromEl.value = toEl.value;
  toEl.value = t;
  calculate();
}

function copyResult() {
  navigator.clipboard.writeText(resultEl.textContent.replace("Result: ",""));
}

modeEl.onchange = () => {
  populateUnits();
  materialSection.style.display = modeEl.value === "cytons" ? "block" : "none";
  densityEl.value = DENSITIES[materialEl.value];
  calculate();
};

materialEl.onchange = () => densityEl.value = DENSITIES[materialEl.value];

document.addEventListener("input", calculate);

populateUnits();
calculate();
</script>

</body>
</html>
